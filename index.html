<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Budget Tracker — a client-side personal account book. Every entry carries the balance it left behind."
    />
    <meta name="theme-color" content="#2f3b8c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Budget Tracker</title>
    <script>
      // Applied before first paint so the sheet never flashes the wrong side.
      try {
        var stored = localStorage.getItem('budget-tracker:theme');
        var theme = stored ? JSON.parse(stored) : null;
        var dark =
          theme === 'dark' ||
          ((!theme || theme === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      THESIS: An account book, not a dashboard. Every entry carries the balance it
      left behind, so "how am I doing" is answered by the register's own
      construction. Refuses the KPI-card row, the donut, and the filter-table that
      every budget app ships.
      OWN-WORLD: Cheque safety-tint stock, carbon-copy blue as the committed ink,
      ledger red reserved solely for trouble. Ruled columns and hairline rules
      instead of cards; Archivo Narrow column heads, Archivo tabular figures,
      Courier Prime for the stamped reference layer. Dark mode is the carbon copy.
      STORY: The visitor reads a period, sees where the month stands against how
      much of it has elapsed, and enters money in seconds without leaving the page.
      FIRST VIEWPORT: Statement head with account name, period, and a DAY n OF n
      rule. Beneath it the summary block — brought forward, paid in, paid out,
      transfers, carried forward — right-aligned on a shared decimal, red only when
      negative. Then the standing-order sheet with a scheduled tick per budget.
      Primary action sits in the statement head as ENTER TRANSACTION.
      FORM: The Passbook, candidate 1 of my ordered grounded list, chosen by the
      user over the assigned roll (candidate 3, The Kursbuch); seed key eca57932.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
